services:
  # ---------- Backend ----------
  - type: web
    name: vtu-backend
    env: python
    repo: .
    region: oregon
    buildCommand: |
      pip install -r backend/requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
    startCommand: |
      uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      PLAYWRIGHT_BROWSERS_PATH: "0"
      # SQLite default for immediate local running without any setup
      DATABASE_URL: sqlite:///./vtuwhatnow.db
      PYTHONPATH: backend

      # VTU Semester Result Portal URLs (index.php is the form entry)
      VTU_URL_SEM1: https://results.vtu.ac.in/D25J26Ecbcs/index.php
      VTU_URL_SEM2: https://results.vtu.ac.in/MJ26cbcs/index.php
      VTU_URL_MAKEUP: https://results.vtu.ac.in/SME26cbcs/index.php

      # Delay between student scrapes in seconds (to mimic human behavior)
      DELAY_MIN: "2"
      DELAY_MAX: "3"

      # Allow the frontend service to call the API
      ALLOWED_ORIGINS: https://vtu-whatnow.vercel.app,https://vtu-frontend.onrender.com,*

      # Admin panel protection password
      ADMIN_PASSWORD: admin

      # Safe Playwright concurrency limit for Render 512MB free tier
      MAX_CONCURRENT_SCRAPERS: "10"

  # ---------- Frontend ----------
  - type: web
    name: vtu-frontend
    env: node
    repo: .
    region: oregon
    buildCommand: |
      cd frontend && npm ci && npm run build
    startCommand: |
      cd frontend && npm start   # uses `next start` from package.json
    envVars:
      # URL that the UI uses to talk to the backend service
      NEXT_PUBLIC_API_URL: https://vtu-backend.onrender.com