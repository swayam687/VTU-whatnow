services:
  # ---------- Backend ----------
  - type: web
    name: vtu-backend
    env: python
    repo: .
    region: oregon
    buildCommand: |
      pip install -r backend/requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.cache/ms-playwright playwright install --with-deps chromium
    startCommand: |
      uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      PLAYWRIGHT_BROWSERS_PATH: /opt/render/project/src/.cache/ms-playwright
      # SQLite default for immediate local running without any setup
      DATABASE_URL: sqlite:///./vtuwhatnow.db
      PYTHONPATH: backend

      # VTU Semester Result Portal URLs (index.php is the form entry)
      VTU_URL_SEM1: https://results.vtu.ac.in/D25J26Ecbcs/index.php
      VTU_URL_SEM2: https://results.vtu.ac.in/MJ26cbcs/index.php

      # Delay between student scrapes in seconds (to mimic human behavior)
      DELAY_MIN: "5"
      DELAY_MAX: "10"

      # Allow the frontend service to call the API (will be overwritten by the
      # actual frontend URL after it is created)
      ALLOWED_ORIGINS: https://vtu-frontend.onrender.com

      # Admin panel protection password
      ADMIN_PASSWORD: admin123

  # ---------- Frontend ----------
  - type: web
    name: vtu-frontend
    env: node
    repo: .
    region: oregon
    buildCommand: |
      cd frontend && npm ci && npm run build
    startCommand: |
      cd frontend && npm start   # uses `next start` from package.json
    envVars:
      # URL that the UI uses to talk to the backend service
      NEXT_PUBLIC_API_URL: https://vtu-backend.onrender.com